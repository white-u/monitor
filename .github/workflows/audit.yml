name: audit

on:
  push:
    branches: [main]
    paths: ["Cargo.lock"]
  pull_request:
    paths: ["Cargo.lock"]
  # Advisories are published without any commit here; a failed scheduled run
  # emails whoever last edited this schedule.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  # A fix merged to main protects no one until it ships, so the scheduled run
  # also audits the latest release and stays red until a release carries it.
  # Advisories on crates that are in Cargo.lock but not compiled in, such as an
  # optional feature left off, are listed without failing.
  released:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git checkout "$(gh release view --json tagName -q .tagName)"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: |
          cargo audit --json > audit.json || true
          jq -e '.vulnerabilities.list' audit.json > /dev/null
          # Resolve once outside the conditional: a failed dependency lookup must
          # fail the audit, not be mistaken for an unused vulnerable package.
          cargo tree --locked -e normal --target all --prefix none --format '{p}' > compiled-tree.txt
          awk 'NF >= 2 { print $1 "@" substr($2, 2) }' compiled-tree.txt > compiled-packages.txt
          failed=0
          while read -r crate id; do
            if grep -Fxq "$crate" compiled-packages.txt; then
              echo "::error::$crate ($id) ships in the latest release"
              failed=1
            else
              echo "$crate ($id) is in Cargo.lock but not compiled in"
            fi
          done < <(jq -r '.vulnerabilities.list[] | "\(.package.name)@\(.package.version) \(.advisory.id)"' audit.json)
          exit "$failed"
